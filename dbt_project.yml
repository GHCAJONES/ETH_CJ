
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'eth'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'eth'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


seeds:
  +database: seeds
  +schema: static

vars:
  token_name_var: 'tron'
  token_address_var: '0x50327c6c5a14dcade707abad2e27eb517df87ab5'
  token_decimals_var: '6'

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['eth', 'dbt_utils']


models:
  eth:
    # Config indicated by + and applies to all files under models/example/
    # example:
       +materialized: view
       +tags: ['eth', 'crypto']
       +post-hook:
        - GRANT USAGE ON DATABASE DBT TO ROLE TESTER;
        - GRANT USAGE ON SCHEMA DBT.DBT_DEV TO ROLE TESTER; 
       +grants: 
        select: ['TESTER']


       source:
        +materialized: view   # defines at a global level all objects in the DB/Schema will be views
        +schema: source       # defines that a schema should be created in the DB if not already created
        +tags:
          - elt
        +post-hook:
         - GRANT USAGE ON SCHEMA DBT.DBT_DEV_SOURCE TO ROLE TESTER;         
        +grants: 
         select: ['TESTER']


       staging:
        +materialized: view   # defines at a global level all objects in the DB/Schema will be views
        +schema: staging      # defines that a schema should be created in the DB if not already created       
        +tags:
          - elt
        +post-hook:
         - GRANT USAGE ON SCHEMA DBT.DBT_DEV_STAGING TO ROLE TESTER;   
        +grants: 
         select: ['TESTER']         

       marts:
        +materialized: table  # defines at a global level all objects in the DB/Schema will be tables
        +schema: marts        # defines that a schema should be created in the DB if not already created
        +tags:
          - powerbi
          - report
        +post-hook:
         - GRANT USAGE ON SCHEMA DBT.DBT_DEV_MARTS TO ROLE TESTER;  
        +grants: 
         select: ['TESTER']







